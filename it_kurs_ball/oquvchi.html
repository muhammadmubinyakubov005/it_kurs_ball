<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👨‍🎓 IT PARK — O'quvchi Shaxsiy Portali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
      background: linear-gradient(135deg, #f0f4f9 0%, #e2e8f0 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 500px;
      padding: 0 0 80px;
      transition: max-width 0.3s ease;
    }

    .portal-desktop-grid {
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 850px) {
      .app {
        max-width: 1100px;
        padding: 20px 24px 80px;
      }
      .top-header {
        border-radius: 20px;
        margin-bottom: 20px;
        border: 1.5px solid #e2e8f0;
      }
      .portal-desktop-grid {
        display: grid;
        grid-template-columns: 460px 1fr;
        gap: 24px;
        align-items: start;
      }
      .picker-box {
        margin: 0 0 16px 0;
      }
      .profile-card {
        margin: 0 0 16px 0;
      }
      .stats-grid {
        margin: 0 0 18px 0;
      }
      .leader-section {
        padding: 0;
      }
    }
    .top-header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-bottom: 1.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #0284c7, #22c55e);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: #fff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .header-title { font-size: 1.1rem; font-weight: 900; color: #1e293b; }
    .header-sub { font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-badge {
      background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe;
      padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800;
    }

    /* O'quvchini tanlash bloki */
    .picker-box {
      margin: 16px;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }
    .picker-label { font-size: 0.85rem; font-weight: 800; color: #475569; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .picker-select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.2s;
    }
    .picker-select:focus { outline: none; border-color: #0284c7; background: #fff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

    /* Shaxsiy Profil Kartasi */
    .profile-card {
      margin: 0 16px 16px;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
    }
    .card-banner {
      height: 85px;
      background: linear-gradient(135deg, #0284c7 0%, #6366f1 50%, #ec4899 100%);
      position: relative;
    }
    .card-id-tag {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }
    .card-body { padding: 0 18px 18px; margin-top: -38px; }
    .card-avatar-wrap { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 12px; }
    .card-avatar {
      width: 76px; height: 76px; border-radius: 50%;
      border: 4px solid #fff; box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      background: #f8fafc;
    }
    .card-rank-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff; padding: 4px 12px; border-radius: 12px;
      font-size: 0.8rem; font-weight: 900;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
      margin-bottom: 8px;
    }
    .card-name { font-size: 1.3rem; font-weight: 900; color: #0f172a; line-height: 1.2; }
    .card-group { font-size: 0.82rem; color: #64748b; font-weight: 700; margin-top: 2px; margin-bottom: 10px; }
    .card-level-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a;
      padding: 5px 12px; border-radius: 14px; font-size: 0.78rem; font-weight: 800;
      margin-bottom: 14px;
    }

    /* XP va Streak ko'rsatkichi */
    .xp-block {
      display: flex; justify-content: space-between; align-items: center;
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px;
      padding: 14px 16px; margin-bottom: 14px;
    }
    .xp-big {
      font-size: 2.1rem; font-weight: 900; color: #0284c7;
      font-family: 'JetBrains Mono', monospace; line-height: 1;
    }
    .xp-label { font-size: 0.7rem; color: #64748b; font-weight: 800; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px; }
    .streak-badge {
      display: flex; align-items: center; gap: 6px;
      background: #fff7ed; border: 1px solid #fed7aa; color: #c2410c;
      padding: 8px 14px; border-radius: 14px; font-size: 0.85rem; font-weight: 800;
    }

    /* Progress bar */
    .progress-wrap { margin-bottom: 8px; }
    .progress-label {
      display: flex; justify-content: space-between; font-size: 0.78rem; font-weight: 700;
      color: #64748b; margin-bottom: 6px;
    }
    .progress-bar {
      height: 10px; background: #e2e8f0; border-radius: 6px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, #0284c7, #22c55e);
      transition: width 0.4s ease;
    }
    .progress-hint { font-size: 0.72rem; color: #64748b; text-align: right; margin-top: 4px; font-weight: 600; }

    /* Statistika kartochkalari */
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin: 0 16px 18px;
    }
    .stat-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
      padding: 12px 10px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .stat-icon { font-size: 1.3rem; margin-bottom: 2px; }
    .stat-num { font-size: 1.15rem; font-weight: 900; color: #0f172a; }
    .stat-label { font-size: 0.68rem; color: #64748b; font-weight: 700; text-transform: uppercase; }

    /* Reyting ro'yxati */
    .leader-section { padding: 0 16px; }
    .leader-header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .leader-title {
      font-size: 1.05rem; font-weight: 900; color: #0f172a;
      display: flex; align-items: center; gap: 6px;
    }
    .leader-filter-select {
      background: #fff; border: 1.5px solid #cbd5e1; border-radius: 10px;
      padding: 6px 10px; font-family: inherit; font-size: 0.78rem; font-weight: 700; color: #334155;
    }
    .leader-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: #fff; border: 1.5px solid #e2e8f0;
      border-radius: 14px; margin-bottom: 8px; transition: all 0.2s;
    }
    .leader-item.me {
      border-color: #0284c7;
      background: linear-gradient(90deg, #f0f9ff, #ffffff);
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.12);
      transform: scale(1.01);
    }
    .leader-left { display: flex; align-items: center; gap: 12px; }
    .leader-rank {
      font-size: 0.85rem; font-weight: 900; color: #64748b;
      min-width: 26px; text-align: center;
    }
    .leader-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #e2e8f0; }
    .leader-name { font-size: 0.9rem; font-weight: 800; color: #0f172a; }
    .leader-group-text { font-size: 0.72rem; color: #64748b; font-weight: 600; }
    .leader-xp {
      font-size: 0.95rem; font-weight: 900; color: #0284c7;
      font-family: 'JetBrains Mono', monospace;
    }
    .leader-me-tag {
      background: #0284c7; color: #fff; padding: 2px 6px; border-radius: 6px;
      font-size: 0.65rem; font-weight: 800; margin-left: 4px;
    }

    .empty-state { text-align: center; padding: 40px 20px; color: #64748b; }
    .empty-icon { font-size: 3rem; margin-bottom: 8px; }

    /* Pastki havola */
    .bottom-link-bar {
      margin-top: 24px; text-align: center; padding: 0 16px;
    }
    .bottom-link {
      color: #64748b; text-decoration: none; font-size: 0.8rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="top-header">
      <div class="header-brand">
        <div class="header-logo">🏢</div>
        <div>
          <div class="header-title">IT PARK</div>
          <div class="header-sub">O'quvchi Shaxsiy Portali</div>
        </div>
      </div>
      <span class="header-badge">📱 Jonli Tizim</span>
    </header>

    <!-- Portal Asosiy Grid (Kompyuter va telefon moslashuvi) -->
    <div class="portal-desktop-grid">
      <div class="portal-col-left">
        <!-- O'quvchini tanlash -->
        <div class="picker-box">
          <div class="picker-label">👤 Ismingizni tanlang:</div>
          <select class="picker-select" id="studentPicker" onchange="onStudentChange()">
            <option value="">— O'quvchini tanlang —</option>
          </select>
        </div>

        <!-- Shaxsiy Profil -->
        <div id="profileArea">
          <div class="empty-state">
            <div class="empty-icon">👆</div>
            <p style="font-weight: 800; font-size: 1.05rem; color:#1e293b;">Ismingizni tanlang</p>
            <p style="font-size: 0.85rem; margin-top: 4px;">Sizning to'plagan ballaringiz, unvoningiz va darajangiz ko'rinadi</p>
          </div>
        </div>
      </div>

      <div class="portal-col-right">
        <!-- Umumiy Reyting -->
        <div class="leader-section">
          <div class="leader-header-bar">
            <div class="leader-title">🏆 Guruh Reytingi</div>
            <select class="leader-filter-select" id="leaderFilterSelect" onchange="renderLeaderboard()">
              <option value="ALL">Barcha Guruhlar</option>
            </select>
          </div>
          <div id="leaderList"></div>
        </div>
      </div>
    </div>

    <div class="bottom-link-bar">
      <a href="index.html" class="bottom-link">
        <span>👨‍🏫 O'qituvchi boshqaruvi va proyektorga o'tish</span>
      </a>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'IT_PARK_OFFICIAL_STUDENTS_V2';
    let selectedStudentId = null;

    const LEVELS = [
      { level: 1, name: 'Novice Coder', emoji: '🐣', min: 0, max: 60 },
      { level: 2, name: 'Code Ninja', emoji: '⚡', min: 61, max: 150 },
      { level: 3, name: 'Bug Hunter', emoji: '🎯', min: 151, max: 300 },
      { level: 4, name: 'Cyber Master', emoji: '🛡️', min: 301, max: 500 },
      { level: 5, name: 'Tech Legend', emoji: '👑', min: 501, max: 9999 }
    ];

    const MONOGRAM_PALETTES = [
      { bg1: '#6366f1', bg2: '#4f46e5' },
      { bg1: '#ec4899', bg2: '#db2777' },
      { bg1: '#06b6d4', bg2: '#0891b2' },
      { bg1: '#10b981', bg2: '#059669' },
      { bg1: '#f59e0b', bg2: '#d97706' },
      { bg1: '#8b5cf6', bg2: '#7c3aed' },
      { bg1: '#3b82f6', bg2: '#2563eb' },
      { bg1: '#14b8a6', bg2: '#0d9488' },
      { bg1: '#f43f5e', bg2: '#e11d48' },
      { bg1: '#64748b', bg2: '#475569' }
    ];

    function getInitials(name) {
      if (!name) return "IT";
      const parts = name.trim().split(/\s+/);
      return parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : parts[0].substring(0, 2).toUpperCase();
    }

    function getAvatar(name) {
      const initials = getInitials(name);
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const p = MONOGRAM_PALETTES[Math.abs(hash) % MONOGRAM_PALETTES.length];
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
        <defs><linearGradient id="s_${initials}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="${p.bg1}"/><stop offset="100%" stop-color="${p.bg2}"/>
        </linearGradient></defs>
        <circle cx="60" cy="60" r="58" fill="url(#s_${initials})" stroke="#fff" stroke-width="4"/>
        <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
        <text x="60" y="74" font-size="42" font-weight="900" fill="#fff" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif">${initials}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function getLevelInfo(xp) {
      for (let l of LEVELS) { if (xp >= l.min && xp <= l.max) return l; }
      return LEVELS[LEVELS.length - 1];
    }

    function getStudents() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const state = JSON.parse(saved);
          if (state.students && state.students.length > 0) return state.students;
        } catch(e) {}
      }
      return [];
    }

    function onStudentChange() {
      const val = document.getElementById('studentPicker').value;
      selectedStudentId = val ? parseInt(val) : null;
      if (selectedStudentId) {
        localStorage.setItem('IT_PARK_LAST_SELECTED_STUDENT', selectedStudentId);
      }
      renderProfile();
      renderLeaderboard();
    }

    function renderPicker(students) {
      const picker = document.getElementById('studentPicker');
      const sortedForPicker = [...students].sort((a,b) => a.name.localeCompare(b.name));
      const savedId = localStorage.getItem('IT_PARK_LAST_SELECTED_STUDENT');
      if (!selectedStudentId && savedId) {
        selectedStudentId = parseInt(savedId);
      }

      picker.innerHTML = '<option value="">— O\'quvchini tanlang —</option>' +
        sortedForPicker.map(s => `<option value="${s.id}" ${s.id == selectedStudentId ? 'selected' : ''}>${s.name} (${s.group})</option>`).join('');

      // Guruhlar ro'yxatini ham filterga to'ldirish
      const filterSelect = document.getElementById('leaderFilterSelect');
      const currentFilter = filterSelect.value;
      const groups = Array.from(new Set(students.map(s => s.group))).filter(Boolean);
      filterSelect.innerHTML = '<option value="ALL">Barcha Guruhlar</option>' +
        groups.map(g => `<option value="${g}" ${g === currentFilter ? 'selected' : ''}>${g}</option>`).join('');
    }

    function renderProfile() {
      const students = getStudents();
      const profileArea = document.getElementById('profileArea');
      const sorted = [...students].sort((a,b) => b.xp - a.xp);

      if (!selectedStudentId) {
        profileArea.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">👆</div>
            <p style="font-weight: 800; font-size: 1.05rem; color:#1e293b;">Ismingizni tanlang</p>
            <p style="font-size: 0.85rem; margin-top: 4px;">Sizning to'plagan ballaringiz, unvoningiz va darajangiz ko'rinadi</p>
          </div>`;
        return;
      }

      const me = students.find(s => s.id === selectedStudentId);
      if (!me) {
        profileArea.innerHTML = '';
        return;
      }

      const rank = sorted.findIndex(s => s.id === me.id) + 1;
      const lvl = getLevelInfo(me.xp);
      const xpInLevel = me.xp - lvl.min;
      const levelRange = lvl.max - lvl.min;
      const pct = Math.min(100, Math.max(0, Math.round((xpInLevel / levelRange) * 100)));
      const remain = Math.max(0, lvl.max - me.xp);
      const rankBadge = rank === 1 ? '🥇 #1' : rank === 2 ? '🥈 #2' : rank === 3 ? '🥉 #3' : `#${rank}`;

      profileArea.innerHTML = `
        <div class="profile-card">
          <div class="card-banner">
            <span class="card-id-tag">ID: #DEV-${String(me.id).slice(-3).padStart(3,'0')}</span>
          </div>
          <div class="card-body">
            <div class="card-avatar-wrap">
              <img class="card-avatar" src="${getAvatar(me.name)}" alt="">
              <span class="card-rank-badge">${rankBadge}</span>
            </div>
            <div class="card-name">${me.name}</div>
            <div class="card-group">${me.group}</div>
            <div class="card-level-pill">${lvl.emoji} Level ${lvl.level}: ${lvl.name}</div>

            <div class="xp-block">
              <div>
                <div class="xp-big">${me.xp}</div>
                <div class="xp-label">Umumiy Ball (XP)</div>
              </div>
              <div class="streak-badge">🔥 ${me.streak || 1} kun streak</div>
            </div>

            <div class="progress-wrap">
              <div class="progress-label">
                <span>Daraja progressi:</span>
                <strong style="color:#0284c7;">${me.xp} / ${lvl.max} XP (${pct}%)</strong>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width:${pct}%;"></div>
              </div>
              <div class="progress-hint">${remain > 0 ? `Keyingi daraja uchun yana ${remain} XP kerak 🚀` : "Eng yuqori cho'qqidasiz! 👑"}</div>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">🎯</div>
            <div class="stat-num">${me.tasks || 0}</div>
            <div class="stat-label">Vazifalar</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🏆</div>
            <div class="stat-num">#${rank}</div>
            <div class="stat-label">Reytingda</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🎁</div>
            <div class="stat-num">${me.rewards || 0}</div>
            <div class="stat-label">Sovg'alar</div>
          </div>
        </div>`;
    }

    function renderLeaderboard() {
      const students = getStudents();
      const filter = document.getElementById('leaderFilterSelect').value;
      let filtered = [...students];
      if (filter !== 'ALL') {
        filtered = filtered.filter(s => s.group === filter);
      }
      filtered.sort((a,b) => b.xp - a.xp);

      const leaderList = document.getElementById('leaderList');
      if (filtered.length === 0) {
        leaderList.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">O\'quvchilar yo\'q</div>';
        return;
      }

      leaderList.innerHTML = filtered.map((s, idx) => {
        const isMe = s.id === selectedStudentId;
        let rankText = `#${idx+1}`;
        if (idx === 0) rankText = '🥇';
        else if (idx === 1) rankText = '🥈';
        else if (idx === 2) rankText = '🥉';

        return `
          <div class="leader-item ${isMe ? 'me' : ''}" onclick="selectStudentDirectly(${s.id})">
            <div class="leader-left">
              <div class="leader-rank">${rankText}</div>
              <img class="leader-avatar" src="${getAvatar(s.name)}" alt="">
              <div>
                <div class="leader-name">
                  ${s.name} ${isMe ? '<span class="leader-me-tag">Siz</span>' : ''}
                </div>
                <div class="leader-group-text">${s.group}</div>
              </div>
            </div>
            <div class="leader-xp">${s.xp} XP</div>
          </div>`;
      }).join('');
    }

    function selectStudentDirectly(id) {
      selectedStudentId = id;
      document.getElementById('studentPicker').value = id;
      localStorage.setItem('IT_PARK_LAST_SELECTED_STUDENT', id);
      renderProfile();
      renderLeaderboard();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderAll() {
      const students = getStudents();
      renderPicker(students);
      renderProfile();
      renderLeaderboard();
    }

    // Jonli yangilanish
    window.addEventListener('storage', () => renderAll());
    setInterval(renderAll, 2500);
    document.addEventListener('DOMContentLoaded', () => renderAll());
  </script>
</body>
</html>
